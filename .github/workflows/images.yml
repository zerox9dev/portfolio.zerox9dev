name: Images

on:
  push:
    branches: [main]

concurrency:
  group: images-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    name: images (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit tag
        run: echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The server is amd64. No provenance or SBOM: each would be one more
      # untagged package version counted against the storage.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/zerox9dev/portfolio-zerox9dev:${{ env.TAG }}
          labels: org.opencontainers.image.source=https://github.com/zerox9dev/portfolio.zerox9dev
          build-args: |
            NEXT_PUBLIC_TELEGRAM_URL=${{ vars.NEXT_PUBLIC_TELEGRAM_URL }}
            NEXT_PUBLIC_BOOK_CALL_URL=${{ vars.NEXT_PUBLIC_BOOK_CALL_URL }}
            NEXT_PUBLIC_GITHUB_URL=${{ vars.NEXT_PUBLIC_GITHUB_URL }}
            NEXT_PUBLIC_CONTACT_EMAIL=${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
            SITE_URL=${{ vars.SITE_URL || 'https://zerox9dev.com' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # --prefer-index=false copies the manifest as it is instead of wrapping
      # it in an index, so the tag adds no package version.
      - name: Move main to this commit
        run: |
          docker buildx imagetools create --prefer-index=false \
            -t "ghcr.io/zerox9dev/portfolio-zerox9dev:main" \
            "ghcr.io/zerox9dev/portfolio-zerox9dev:$TAG"
      - name: Keep the last ten versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: portfolio-zerox9dev
          package-type: container
          min-versions-to-keep: 10
